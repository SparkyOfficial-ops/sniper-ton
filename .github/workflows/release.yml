name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Pack exe and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\sniper-ton.exe dist\sniper-ton-windows-x64.exe
          $hash = (Get-FileHash dist\sniper-ton-windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  sniper-ton-windows-x64.exe" | Set-Content -Encoding ascii dist\sniper-ton-windows-x64.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sniper-ton-windows
          path: dist/*

  linux:
    name: Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: cargo build --release --locked
      - name: Pack binary and checksum
        run: |
          mkdir -p dist
          cp target/release/sniper-ton dist/sniper-ton-linux-x64
          sha256sum dist/sniper-ton-linux-x64 | sed 's|dist/||' > dist/sniper-ton-linux-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sniper-ton-linux
          path: dist/*

  package:
    name: GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sniper-ton-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
