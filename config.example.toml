# snipe — выкуп при появлении нового пула
# copy  — повтор покупок за TON с указанных кошельков
# both  — оба режима
mode = "both"

# Пока true, бот пишет, что купил бы, и не шлёт транзакцию.
dry_run = true

# Сколько TON тратить на одну покупку. Для copy это потолок.
buy_amount_ton = "0.5"

# Допустимое проскальзывание, доля. 0.15 = 15%.
slippage = "0.15"

# Пул слабее этого порога пропускается. Защита от пустых «запусков».
min_liquidity_ton = "10"

# Снайп не берёт токен, если симуляция STON.fi показывает удар по цене выше порога.
max_price_impact = "0.50"

# Секунд на исполнение свопа. Просроченный своп контракт отклонит.
deadline_secs = 90

# Как часто сверять списки пулов, если WebSocket молчит.
poll_secs = 4

# 0 = без лимита. Иначе бот остановится после N успешных отправок.
max_buys = 0

# false: покупать только жетон, которого не было ни в одном пуле на старте.
buy_known_tokens = false

# Кошельки, чьи покупки за TON повторять. Пустой список отключает copy.
copy_wallets = []

# Доля их входа. 0.25 = четверть их суммы, но не больше buy_amount_ton.
copy_scale = "1"

# Игнорировать чужие покупки мельче этого размера.
copy_min_ton = "0.3"

# Не повторять тот же жетон чаще, чем раз в N секунд.
copy_cooldown_secs = 90

# Газ сверх суммы свопа на нативный своп DeDust.
dedust_gas_ton = "0.25"

# Куда слать реферальную комиссию STON.fi. Пусто = на ваш кошелёк.
# v1: комиссия пула (часто 0.1%). v2: referral_fee_bps, максимум 100 (1%).
referral_address = ""
referral_fee_bps = 0

# Можно оставить пустым и задать через .env
tonapi_key = ""
toncenter_api_key = ""
mnemonic = ""

# v4r2, v3r2 или v5r1. Адрес должен совпасть с тем, куда вы отправили TON.
wallet_version = "v4r2"
